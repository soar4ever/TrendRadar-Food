name: Get Hot News

on:
  schedule:
    # 每天北京时间 8:33 运行（UTC 0:33）
    - cron: "33 0 * * *"

  workflow_dispatch:

concurrency:
  group: crawler-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          clean: true

      - name: Checkout gh-pages for history
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages-history
        continue-on-error: true

      - name: Set up Python
        if: success()
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        if: success()
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        if: success()
        run: uv sync --frozen --no-dev

      - name: Verify required files
        if: success()
        run: |
          if [ ! -f config/config.yaml ]; then
            echo "Error: Config missing"
            exit 1
          fi

      - name: Run crawler
        if: success()
        env:
          GITHUB_ACTIONS: true
        run: uv run python -m trendradar

      - name: Merge with historical reports
        if: success()
        run: |
          if [ -d gh-pages-history ]; then
            # 把历史报告复制到 output/html（保留日期目录）
            for dir in gh-pages-history/20*/; do
              dir_name=$(basename "$dir")
              if [ ! -d "output/html/$dir_name" ]; then
                cp -r "$dir" "output/html/$dir_name"
                echo "保留历史报告: $dir_name"
              fi
            done
            # 保留根目录的 .nojekyll
            [ -f gh-pages-history/.nojekyll ] && cp gh-pages-history/.nojekyll output/html/
          fi

      - name: Deploy HTML report to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output/html
          publish_branch: gh-pages
          force_orphan: true
