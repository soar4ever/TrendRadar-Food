name: Get Hot News

on:
  schedule:
    # 每天北京时间 8:33 运行（UTC 0:33）
    - cron: "33 0 * * *"

  workflow_dispatch:

concurrency:
  group: crawler-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write
  pages: write
  id-token: write

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          clean: true

      - name: Checkout gh-pages for history
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: gh-pages-history
        continue-on-error: true

      - name: Set up Python
        if: success()
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        if: success()
        uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        if: success()
        run: uv sync --frozen --no-dev

      - name: Verify required files
        if: success()
        run: |
          if [ ! -f config/config.yaml ]; then
            echo "Error: Config missing"
            exit 1
          fi

      - name: Run crawler
        if: success()
        env:
          GITHUB_ACTIONS: true
        run: uv run python -m trendradar

      - name: Add index page
        if: success()
        run: |
          # 检测最新报告的实际文件名
          LATEST_FILE=$(ls output/html/latest/ | grep '.html$' | head -1)
          if [ -n "$LATEST_FILE" ]; then
            cat > output/html/index.html << HTMLEOF
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0;url=latest/${LATEST_FILE}">
            <title>TrendRadar 美食热点</title>
          </head>
          <body>
            <p>正在跳转到最新热点报告...</p>
            <p>如果没有自动跳转，请 <a href="latest/${LATEST_FILE}">点击这里</a></p>
          </body>
          </html>
          HTMLEOF
            echo "创建 index.html → latest/${LATEST_FILE}"
          fi

      - name: Merge with historical reports
        if: success()
        run: |
          if [ -d gh-pages-history ]; then
            for dir in gh-pages-history/20*/; do
              dir_name=$(basename "$dir")
              if [ ! -d "output/html/$dir_name" ]; then
                cp -r "$dir" "output/html/$dir_name"
                echo "保留历史报告: $dir_name"
              fi
            done
            [ -f gh-pages-history/.nojekyll ] && cp gh-pages-history/.nojekyll output/html/
          fi

      - name: Deploy HTML report to GitHub Pages
        if: success()
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output/html
          publish_branch: gh-pages
          force_orphan: true
